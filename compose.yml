# Entorno local de OrderSaga: Kafka y, en los bloques siguientes, cada servicio con su base de datos y sus procesos.

# Configuración común de los procesos de orders: misma imagen y mismo entorno
x-orders: &orders
  build:
    context: .
    args:
      SERVICE: orders
  image: ordersaga-orders
  environment:
    DATABASE_URL: postgres://orders:orders@db-orders:5432/orders
    KAFKA_BROKERS: kafka:9092

# Configuración común de los procesos de stock: misma imagen y mismo entorno
x-stock: &stock
  build:
    context: .
    args:
      SERVICE: stock
  image: ordersaga-stock
  environment:
    DATABASE_URL: postgres://stock:stock@db-stock:5432/stock
    KAFKA_BROKERS: kafka:9092

services:
  #* Kafka

  # Kafka de un solo nodo en modo KRaft (broker y controller a la vez), solo accesible dentro de la red de compose
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Servicio que crea los topics (3 particiones cada uno) y termina
  kafka-init:
    image: apache/kafka:4.3.1
    command:
      - bash
      - -c
      - |
        set -e
        for topic in orders stock payments; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  #* Orders

  # Base de datos de orders: pedidos y outbox. Sin puerto en el host ni volumen con nombre
  db-orders:
    image: postgres:18
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migraciones de orders: aplica con goose las pendientes antes de que arranquen la API y el productor, y termina
  orders-migrate:
    <<: *orders
    command: ["migrate"]
    depends_on:
      db-orders:
        condition: service_healthy

  # API de orders en el puerto 8001: arranca con las migraciones aplicadas y está sana cuando /health responde 200
  orders-api:
    <<: *orders
    command: ["api"]
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      orders-migrate:
        condition: service_completed_successfully

  # Productor de orders: publica en Kafka los eventos de la outbox de orders. Misma imagen que la api de orders
  orders-producer:
    <<: *orders
    command: ["producer"]
    restart: unless-stopped
    depends_on:
      orders-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  #* Stock

  # Base de datos de stock: productos, reservas y outbox. Sin puerto en el host ni volumen con nombre
  db-stock:
    image: postgres:18
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migraciones de stock: crea las tablas y carga el catálogo con goose antes que los demás procesos, y termina
  stock-migrate:
    <<: *stock
    command: ["migrate"]
    depends_on:
      db-stock:
        condition: service_healthy

  # API de stock en el puerto 8002: arranca con las migraciones aplicadas y está sana cuando /health responde 200
  stock-api:
    <<: *stock
    command: ["api"]
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      stock-migrate:
        condition: service_completed_successfully

  # Productor de stock: publica en Kafka los eventos de la outbox de stock. Misma imagen que la api de stock
  stock-producer:
    <<: *stock
    command: ["producer"]
    restart: unless-stopped
    depends_on:
      stock-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  # Consumidor de stock: lee los eventos de orders y reserva unidades. Si falla, compose lo reinicia
  stock-consumer:
    <<: *stock
    command: ["consumer"]
    restart: unless-stopped
    depends_on:
      stock-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
